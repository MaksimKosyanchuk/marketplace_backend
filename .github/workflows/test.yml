name: Backend Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marketplace
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run migrations (Prisma)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/marketplace?schema=public
          JWT_ACCESS_SECRET: test_jwt_access_secret_key_12345
          JWT_REFRESH_SECRET: test_jwt_refresh_secret_key_12345
        run: npx prisma migrate deploy

      - name: Run unit tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/marketplace?schema=public
          REDIS_HOST: localhost
          PORT: 3001
          JWT_ACCESS_SECRET: test_jwt_access_secret_key_12345
          JWT_REFRESH_SECRET: test_jwt_refresh_secret_key_12345
        run: npm run test

      - name: Run E2E tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/marketplace?schema=public
          REDIS_HOST: localhost
          PORT: 3001
          JWT_ACCESS_SECRET: test_jwt_access_secret_key_12345
          JWT_REFRESH_SECRET: test_jwt_refresh_secret_key_12345
        run: npm run test:e2e